options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'golang:1.19.1'
    entrypoint: 'sh'
    args: ['-c', 'go mod tidy && go build -o opsgo']

  - name: 'docker.io/sonarsource/sonar-scanner-cli'
    entrypoint: 'sonar-scanner'
    args:
      - '-Dsonar.projectKey=opsgo'
      - '-Dsonar.sources=.'
      - '-Dsonar.host.url=http://34.10.176.217:9000'
      - '-Dsonar.login=$SONAR_TOKEN'
    env:
      - 'SONAR_TOKEN'

availableSecrets:
  secretManager:
    - versionName: projects/391675659319/secrets/SONAR_TOKEN/versions/latest
      env: 'SONAR_TOKEN'
